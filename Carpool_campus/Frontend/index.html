<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CarpoolCampus — Share the ride to campus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<style>
/* ============================= TOKENS ============================= */
:root{
  --radius-s:10px; --radius-m:16px; --radius-l:24px; --radius-pill:999px;
  --amber:#1996C4; --amber-ink:#0E5A78;
  --teal:#0E8E7E; --teal-soft:#DFF2EE;
  --coral:#E15B4D; --coral-soft:#FBEAE7;
  --shadow: 0 16px 40px -16px rgba(10,40,60,.35);
  --grad-a:#E4F7FD; --grad-b:#3AA9DD; --grad-c:#0E6FA8;
  --ff-display:'Manrope',sans-serif;
  --ff-body:'IBM Plex Sans',sans-serif;
  --ff-mono:'IBM Plex Mono',monospace;
}
html[data-theme="light"]{
  --bg:#EEF3F6; --bg-elev:#FFFFFF; --bg-sidebar:#0C2A3D; --bg-sidebar-elev:#123950;
  --ink:#0C2334; --ink-soft:#4C6473; --ink-faint:#8497A3;
  --border:#DCE6EC; --border-soft:#EAF1F4;
  --amber:#1996C4; --amber-soft:#DEF3FB;
  --teal:#0E8E7E; --teal-soft:#DFF2EE;
  --coral:#C94A3C; --coral-soft:#FBE7E4;
  --sidebar-ink:#EAF6FC; --sidebar-ink-soft:#84AEC2;
  --input-bg:#FFFFFF;
  --grad-a:#E4F7FD; --grad-b:#3AA9DD; --grad-c:#0E6FA8;
}
html[data-theme="dark"]{
  --bg:#081A25; --bg-elev:#0E2534; --bg-sidebar:#051620; --bg-sidebar-elev:#0C2130;
  --ink:#EAF6FC; --ink-soft:#9FC2D3; --ink-faint:#5E828F;
  --border:#173547; --border-soft:#112935;
  --amber:#3FC1F0; --amber-soft:#0E2C38;
  --teal:#2FD9C4; --teal-soft:#0E2C28;
  --coral:#FF7C6C; --coral-soft:#2C1815;
  --sidebar-ink:#EAF6FC; --sidebar-ink-soft:#5E828F;
  --input-bg:#0F243173;
  --shadow: 0 16px 40px -16px rgba(0,0,0,.6);
  --grad-a:#0E2C3B; --grad-b:#0E5578; --grad-c:#123B54;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg); color:var(--ink); font-family:var(--ff-body);
  font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased;
  transition:background .25s ease, color .25s ease;
}
h1,h2,h3,h4{font-family:var(--ff-display); margin:0; letter-spacing:-0.01em;}
.mono{font-family:var(--ff-mono);}
a{color:inherit;}
button{font-family:inherit;}
::selection{background:var(--amber-soft);}
.icon{width:18px;height:18px;stroke-width:1.75;flex-shrink:0;}
.icon-sm{width:15px;height:15px;stroke-width:2;}
.icon-lg{width:26px;height:26px;stroke-width:1.5;}

/* ============================= LAYOUT ============================= */
#app{min-height:100vh;}
.auth-shell{
  min-height:100vh; display:grid; grid-template-columns: 1.05fr 1fr;
}
@media (max-width:900px){ .auth-shell{grid-template-columns:1fr;} .auth-visual{display:none;} }
.auth-visual{
  background:linear-gradient(135deg, var(--grad-a) 0%, var(--grad-b) 62%, var(--grad-c) 100%);
  color:var(--ink); position:relative; overflow:hidden;
  padding:40px 48px; display:flex; flex-direction:column; justify-content:space-between; gap:22px;
}
.zigzag{position:absolute; opacity:.55; color:var(--ink);}
.auth-visual .board{
  border:1px solid rgba(12,35,52,.12); border-radius:var(--radius-l); overflow:hidden; background:rgba(255,255,255,.72); backdrop-filter:blur(8px);
  box-shadow:var(--shadow);
}
.board-head{display:flex; justify-content:space-between; align-items:center; padding:14px 18px; border-bottom:1px solid rgba(12,35,52,.1);}
.board-head span{font-family:var(--ff-mono); font-size:11.5px; color:var(--ink-faint); letter-spacing:.03em;}
.board-row{display:flex; align-items:center; gap:14px; padding:13px 18px; border-bottom:1px solid rgba(12,35,52,.07);}
.board-row:last-child{border-bottom:none;}
.board-row .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.board-time{font-family:var(--ff-mono); font-size:15px; width:56px; color:var(--amber-ink);}
.board-route{flex:1; font-size:14px; color:var(--ink);}
.board-route small{display:block; color:var(--ink-faint); font-size:12px; margin-top:2px;}
.board-status{font-family:var(--ff-mono); font-size:11px; padding:3px 8px; border-radius:20px; text-transform:lowercase;}

.app-shell{display:grid; grid-template-columns:230px 1fr; min-height:100vh;}
@media (max-width:880px){ .app-shell{grid-template-columns:1fr;} }
.sidebar{
  background:var(--bg-sidebar); color:var(--sidebar-ink); padding:22px 14px; display:flex; flex-direction:column;
  position:sticky; top:0; height:100vh;
}
@media (max-width:880px){ .sidebar{display:none;} }
.brand{display:flex; align-items:center; gap:10px; padding:6px 10px 26px 10px;}
.brand .mark{width:32px;height:32px;border-radius:11px;background:linear-gradient(155deg,var(--grad-b),var(--grad-c)); display:flex; align-items:center; justify-content:center; color:#EAF6FC;}
.brand b{font-family:var(--ff-display); font-size:16px; font-weight:800;}
.nav{display:flex; flex-direction:column; gap:2px; flex:1;}
.nav-item{
  display:flex; align-items:center; gap:11px; padding:10px 14px; border-radius:var(--radius-pill);
  color:var(--sidebar-ink-soft); cursor:pointer; font-size:13.5px; font-weight:600; position:relative; border:none; background:none; text-align:left; width:100%;
}
.nav-item:hover{background:var(--bg-sidebar-elev); color:var(--sidebar-ink);}
.nav-item.active{background:var(--amber); color:#04141C;}
.nav-item .badge-count{margin-left:auto; background:var(--coral); color:#fff; font-family:var(--ff-mono); font-size:10.5px; padding:1px 6px; border-radius:20px; font-weight:600;}
.nav-foot{border-top:1px solid #23264A; padding-top:14px; margin-top:8px;}
.nav-user{display:flex; align-items:center; gap:10px; padding:6px 10px;}
.nav-user b{display:block; font-size:13px; font-weight:600;}
.nav-user span{font-size:11.5px; color:var(--sidebar-ink-soft);}

.main-col{display:flex; flex-direction:column; min-width:0;}
.topbar{
  display:flex; align-items:center; gap:14px; padding:16px 26px; border-bottom:1px solid var(--border);
  position:sticky; top:0; background:var(--bg); z-index:20; backdrop-filter:blur(6px);
}
@media (max-width:880px){ .topbar{padding:14px 16px;} }
.topbar h1{font-size:19px;}
.topbar .sub{font-size:12.5px; color:var(--ink-faint); margin-top:1px;}
.topbar-actions{margin-left:auto; display:flex; align-items:center; gap:8px;}
.icon-btn{
  width:36px; height:36px; border-radius:50%; border:1px solid var(--border); background:var(--bg-elev);
  display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--ink); position:relative;
}
.icon-btn:hover{border-color:var(--amber);}
.icon-btn .dot-badge{position:absolute; top:6px; right:6px; width:7px;height:7px;border-radius:50%; background:var(--coral); border:1.5px solid var(--bg-elev);}
.hamburger{display:none;}
@media (max-width:880px){ .hamburger{display:flex;} }

.content{padding:26px; max-width:1180px; width:100%; margin:0 auto; flex:1;}
@media (max-width:880px){ .content{padding:16px; padding-bottom:88px;} }

.bottom-nav{
  display:none; position:fixed; bottom:0; left:0; right:0; background:var(--bg-sidebar); border-top:1px solid #23264A;
  z-index:30; padding:6px 4px 8px;
}
@media (max-width:880px){ .bottom-nav{display:flex; justify-content:space-around;} }
.bnav-item{display:flex; flex-direction:column; align-items:center; gap:3px; color:var(--sidebar-ink-soft); background:none; border:none; padding:6px 8px; font-size:10px; font-family:var(--ff-body); position:relative;}
.bnav-item.active{color:var(--amber);}
.bnav-item .badge-count{position:absolute; top:2px; right:2px; width:7px;height:7px; border-radius:50%; background:var(--coral);}

/* ============================= COMPONENTS ============================= */
.section-title{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:14px; gap:10px; flex-wrap:wrap;}
.section-title h2{font-size:16px;}
.section-title .hint{font-size:12.5px; color:var(--ink-faint);}

.btn{
  display:inline-flex; align-items:center; gap:7px; justify-content:center; padding:10px 18px; border-radius:var(--radius-pill);
  border:1px solid transparent; font-weight:700; font-size:13.5px; cursor:pointer; transition:transform .1s ease, opacity .15s;
  white-space:nowrap;
}
.btn:active{transform:scale(.97);}
.btn:disabled{opacity:.55; cursor:not-allowed;}
.btn-primary{background:var(--bg-sidebar); color:#EAF6FC;}
html[data-theme="dark"] .btn-primary{background:var(--amber); color:#04141C;}
.btn-primary:hover{filter:brightness(1.15);}
.btn-ghost{background:var(--bg-elev); color:var(--ink); border-color:var(--border);}
.btn-ghost:hover{border-color:var(--amber);}
.btn-quiet{background:none; color:var(--ink-soft); border:none; padding:8px 10px;}
.btn-quiet:hover{color:var(--ink);}
.btn-danger{background:var(--coral-soft); color:var(--coral); border-color:transparent;}
.btn-danger:hover{filter:brightness(0.97);}
.btn-teal{background:var(--teal-soft); color:var(--teal);}
.btn-sm{padding:7px 12px; font-size:12.5px;}
.btn-block{width:100%;}

.field{margin-bottom:16px;}
.field label{display:block; font-size:12.5px; font-weight:600; color:var(--ink-soft); margin-bottom:6px;}
.field .hint{font-size:11.5px; color:var(--ink-faint); margin-top:5px;}
input[type=text],input[type=email],input[type=password],input[type=number],input[type=time],input[type=date],input[type=tel],select,textarea{
  width:100%; padding:11px 13px; border-radius:var(--radius-s); border:1px solid var(--border); background:var(--input-bg);
  color:var(--ink); font-family:var(--ff-body); font-size:14px; outline:none;
}
textarea{resize:vertical; min-height:70px;}
input:focus,select:focus,textarea:focus{border-color:var(--amber); box-shadow:0 0 0 3px var(--amber-soft);}
.input-err{border-color:var(--coral) !important;}
.err-msg{color:var(--coral); font-size:12px; margin-top:6px;}
.radio-row{display:flex; gap:8px;}
.radio-chip{flex:1; border:1px solid var(--border); border-radius:var(--radius-s); padding:10px; text-align:center; cursor:pointer; font-size:13px; font-weight:600; color:var(--ink-soft); display:flex; align-items:center; justify-content:center; gap:6px;}
.radio-chip.sel{border-color:var(--amber); background:var(--amber-soft); color:var(--amber-ink); }
html[data-theme=dark] .radio-chip.sel{color:var(--amber);}
.day-row{display:flex; gap:6px; flex-wrap:wrap;}
.day-chip{width:42px; height:42px; border-radius:50%; border:1px solid var(--border); background:var(--input-bg); color:var(--ink-soft); font-size:12px; font-weight:700; cursor:pointer; font-family:var(--ff-mono);}
.day-chip.sel{background:var(--teal); border-color:var(--teal); color:#fff;}

.card{background:var(--bg-elev); border:1px solid var(--border); border-radius:var(--radius-l); padding:20px;}
.hero-card{
  background:linear-gradient(120deg, var(--grad-a) 0%, var(--grad-b) 70%, var(--grad-c) 100%); color:var(--ink); border-radius:var(--radius-l);
  padding:26px 28px; position:relative; overflow:hidden; margin-bottom:22px; box-shadow:var(--shadow);
}
.hero-top{display:flex; justify-content:space-between; align-items:flex-start; gap:14px; flex-wrap:wrap; position:relative; z-index:1;}
.hero-top .eyebrow{font-size:12px; color:var(--ink-soft); font-weight:600;}
.hero-route{font-family:var(--ff-display); font-weight:800; font-size:22px; margin-top:6px; display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
.hero-route .arrow{color:var(--amber-ink);}
.hero-meta{display:flex; gap:22px; margin-top:18px; flex-wrap:wrap; position:relative; z-index:1;}
.hero-meta div b{display:block; font-family:var(--ff-mono); font-size:20px; color:var(--ink);}
.hero-meta div span{font-size:11.5px; color:var(--ink-soft);}

.stat-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:22px;}
@media (max-width:760px){ .stat-grid{grid-template-columns:repeat(2,1fr);} }
.stat-card{background:var(--bg-elev); border:1px solid var(--border); border-radius:var(--radius-m); padding:16px;}
.stat-card .icon-wrap{width:32px;height:32px;border-radius:9px; display:flex; align-items:center; justify-content:center; margin-bottom:10px;}
.stat-card b{display:block; font-family:var(--ff-mono); font-size:22px;}
.stat-card span{font-size:12px; color:var(--ink-faint);}

.list{border:1px solid var(--border); border-radius:var(--radius-l); overflow:hidden; background:var(--bg-elev);}
.row{display:flex; align-items:center; gap:14px; padding:16px 18px; border-bottom:1px solid var(--border-soft); }
.row:last-child{border-bottom:none;}
.row:hover{background:var(--bg);}
@media (max-width:640px){ .row{flex-wrap:wrap;} }
.row-time{font-family:var(--ff-mono); font-size:16px; color:var(--ink); width:58px; flex-shrink:0;}
.row-line{width:3px; align-self:stretch; border-radius:2px; flex-shrink:0;}
.row-main{flex:1; min-width:0;}
.row-main .title{font-weight:600; font-size:14px; display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
.row-main .sub{font-size:12.5px; color:var(--ink-faint); margin-top:3px; display:flex; gap:12px; flex-wrap:wrap; align-items:center;}
.row-actions{display:flex; gap:8px; flex-shrink:0; align-items:center;}

.badge{display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:600; padding:4px 9px; border-radius:20px; font-family:var(--ff-mono); text-transform:lowercase;}
.b-amber{background:var(--amber-soft); color:var(--amber-ink);} html[data-theme=dark] .b-amber{color:var(--amber);}
.b-teal{background:var(--teal-soft); color:var(--teal);}
.b-coral{background:var(--coral-soft); color:var(--coral);}
.b-grey{background:var(--border-soft); color:var(--ink-faint);}

.avatar{border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:700; font-family:var(--ff-display); flex-shrink:0; color:#fff; overflow:hidden;}
.tabs{display:flex; gap:4px; border-bottom:1px solid var(--border); margin-bottom:20px; overflow-x:auto;}
.tab{padding:10px 4px; margin-right:22px; font-size:13.5px; font-weight:600; color:var(--ink-faint); cursor:pointer; border-bottom:2px solid transparent; white-space:nowrap;}
.tab.active{color:var(--ink); border-color:var(--amber);}

.empty{text-align:center; padding:56px 20px; color:var(--ink-faint);}
.empty .icon-lg{margin:0 auto 14px; color:var(--ink-faint);}
.empty h3{font-size:15px; color:var(--ink); margin-bottom:6px;}
.empty p{font-size:13px; max-width:320px; margin:0 auto 16px;}

.modal-overlay{position:fixed; inset:0; background:rgba(10,11,20,.55); display:flex; align-items:center; justify-content:center; z-index:100; padding:16px; backdrop-filter:blur(2px);}
.modal{background:var(--bg-elev); border-radius:var(--radius-l); padding:26px; max-width:460px; width:100%; max-height:88vh; overflow:auto; box-shadow:var(--shadow); border:1px solid var(--border);}
.modal-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:18px;}
.modal-head h3{font-size:17px;}

.toast-wrap{position:fixed; bottom:20px; right:20px; z-index:200; display:flex; flex-direction:column; gap:8px;}
@media (max-width:880px){ .toast-wrap{left:16px; right:16px; bottom:80px;} }
.toast{background:var(--bg-sidebar); color:var(--sidebar-ink); padding:12px 16px; border-radius:var(--radius-s); font-size:13px; box-shadow:var(--shadow); display:flex; align-items:center; gap:10px; min-width:220px; animation:toastin .2s ease;}
.toast.err{background:var(--coral);}
@keyframes toastin{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);}}

.spinner{width:16px;height:16px;border-radius:50%; border:2px solid rgba(255,255,255,.35); border-top-color:#fff; animation:spin .7s linear infinite;}
.spinner-dark{border:2px solid var(--border); border-top-color:var(--amber);}
@keyframes spin{to{transform:rotate(360deg);}}
.loading-page{display:flex; align-items:center; justify-content:center; padding:80px 0; color:var(--ink-faint); gap:10px;}

.star-input{display:flex; gap:6px;}
.star-input button{background:none; border:none; cursor:pointer; padding:2px; color:var(--border);}
.star-input button.on{color:var(--amber);}
.star-row{display:flex; gap:2px;}
.star-row svg{color:var(--border);}
.star-row svg.on{color:var(--amber); fill:var(--amber);}

.progress-track{height:6px; background:var(--border-soft); border-radius:6px; overflow:hidden;}
.progress-fill{height:100%; background:var(--teal); border-radius:6px;}

.divider{height:1px; background:var(--border); margin:20px 0;}
.kv{display:flex; justify-content:space-between; padding:9px 0; border-bottom:1px solid var(--border-soft); font-size:13.5px;}
.kv:last-child{border-bottom:none;}
.kv span:first-child{color:var(--ink-faint);}
.kv b{font-family:var(--ff-mono);}

.notif-item{display:flex; gap:12px; padding:15px 18px; border-bottom:1px solid var(--border-soft); cursor:pointer;}
.notif-item:last-child{border-bottom:none;}
.notif-item:hover{background:var(--bg);}
.notif-item.unread{background:var(--amber-soft);}
html[data-theme=dark] .notif-item.unread{background:#20200f;}
.notif-ic{width:36px;height:36px;border-radius:50%; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
.notif-item p{margin:0; font-size:13.5px;}
.notif-item time{font-size:11.5px; color:var(--ink-faint);}

.table-wrap{overflow-x:auto; border:1px solid var(--border); border-radius:var(--radius-l); background:var(--bg-elev);}
table{width:100%; border-collapse:collapse; font-size:13.5px; min-width:560px;}
th{text-align:left; font-size:11.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-faint); font-weight:600; padding:12px 16px; border-bottom:1px solid var(--border);}
td{padding:13px 16px; border-bottom:1px solid var(--border-soft);}
tr:last-child td{border-bottom:none;}

.link-text{color:var(--teal); font-weight:600; cursor:pointer; font-size:13px; text-decoration:none;}
.link-text:hover{text-decoration:underline;}
.form-grid-2{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
@media (max-width:520px){ .form-grid-2{grid-template-columns:1fr;} }
.skeleton{background:linear-gradient(90deg, var(--border-soft) 25%, var(--border) 37%, var(--border-soft) 63%); background-size:400% 100%; animation:sk 1.4s ease infinite; border-radius:8px;}
@keyframes sk{0%{background-position:100% 50%;} 100%{background-position:0 50%;}}
.demo-note{font-size:11.5px; color:var(--ink-faint); background:var(--bg); border:1px dashed var(--border); border-radius:8px; padding:9px 12px; margin-top:8px; display:flex; gap:8px; align-items:flex-start;}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast-wrap" id="toastWrap"></div>

<script src="config.js"></script>
<script>
/* ======================================================================
   BACKEND CONFIG — points this frontend at a real CarpoolCampus API
   ====================================================================== */
function getApiBaseUrl(){ return window.CARPOOL_API_BASE_URL || localStorage.getItem('cc_api_base') || 'https://carpool-two-beta.vercel.app/api/v1'; }
function setApiBaseUrl(url){ localStorage.setItem('cc_api_base', url.replace(/\/+$/,'')); }

/* ======================================================================
   TOKEN STORAGE (real browser localStorage — this runs as a normal page)
   ====================================================================== */
function getAccessToken(){ return localStorage.getItem('cc_access_token'); }
function getRefreshToken(){ return localStorage.getItem('cc_refresh_token'); }
function setTokens(access, refresh){ if(access) localStorage.setItem('cc_access_token', access); if(refresh) localStorage.setItem('cc_refresh_token', refresh); }
function clearTokens(){ localStorage.removeItem('cc_access_token'); localStorage.removeItem('cc_refresh_token'); }

class ApiClientError extends Error{
  constructor(code, message, status, details){ super(message||'Request failed'); this.code=code; this.status=status; this.details=details; }
}

/* ======================================================================
   CORE FETCH WRAPPER — matches the API's {success,data,pagination}/{success:false,error} envelope
   ====================================================================== */
async function apiFetch(path, {method='GET', body, isForm=false, auth=true, retry=true} = {}){
  const headers = {};
  if(!isForm) headers['Content-Type'] = 'application/json';
  if(auth){ const t = getAccessToken(); if(t) headers['Authorization'] = 'Bearer '+t; }

  let res;
  try{
    res = await fetch(getApiBaseUrl()+path, { method, headers, body: body===undefined ? undefined : (isForm ? body : JSON.stringify(body)) });
  }catch(netErr){
    throw new ApiClientError('NETWORK_ERROR', `Can't reach the backend at ${getApiBaseUrl()}. Is it running?`, 0);
  }

  if(res.status===204) return null;

  let json = null;
  try{ json = await res.json(); }catch(e){ /* non-JSON response */ }

  if(!res.ok || !json || json.success===false){
    if(res.status===401 && auth && retry){
      const refreshed = await tryRefreshToken();
      if(refreshed) return apiFetch(path, {method, body, isForm, auth, retry:false});
    }
    const e = (json && json.error) || {};
    throw new ApiClientError(e.code || 'ERROR', e.message || `Request failed (${res.status})`, res.status, e.details);
  }
  return json;
}

async function tryRefreshToken(){
  const rt = getRefreshToken();
  if(!rt) return false;
  try{
    const res = await fetch(getApiBaseUrl()+'/auth/refresh-token', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({refreshToken:rt}) });
    const json = await res.json();
    if(res.ok && json.success){ setTokens(json.data.accessToken, null); return true; }
  }catch(e){ /* fall through */ }
  clearTokens(); S.userId=null; S.user=null; S.hasDriverProfile=false;
  if(location.hash !== '#/login') go('#/login');
  return false;
}

function toQuery(obj={}){
  const parts = Object.entries(obj).filter(([,v])=>v!==undefined && v!==null && v!=='').map(([k,v])=>encodeURIComponent(k)+'='+encodeURIComponent(v));
  return parts.length ? '?'+parts.join('&') : '';
}

/* ======================================================================
   ENRICHMENT HELPERS
   The real API deliberately hides exact route text from anyone but the
   route's owner (see API.md §7 note on "match-safe fields"), so trip/match/
   request cards can't show the counterpart's exact origin & destination —
   only what the matching endpoints expose (name, rating, timing). These
   helpers stitch together what IS documented, with light in-memory caching.
   ====================================================================== */
let myRouteIdsCache = null;
async function myRouteIds(){
  if(myRouteIdsCache) return myRouteIdsCache;
  const routes = await api.listMyRoutes({limit:100});
  myRouteIdsCache = new Set(routes.map(r=>r.id));
  return myRouteIdsCache;
}
function invalidateRouteCache(){ myRouteIdsCache = null; routeCache = {}; matchListCache = {}; }
let routeCache = {};
async function getRouteCached(id){
  if(routeCache[id]) return routeCache[id];
  const r = await api.getRoute(id);
  routeCache[id] = r;
  return r;
}
let matchListCache = {};
async function getMatchesForRouteCached(routeId){
  if(matchListCache[routeId]) return matchListCache[routeId];
  const list = await api.getMatchesForRoute(routeId, {limit:100});
  matchListCache[routeId] = list;
  return list;
}
// GET /routes/me only returns {id, role, daysOfWeek, departureTime, status} per API.md —
// origin/destination need a separate GET /routes/:id per route (fine: these are all
// routes we own, so that call is always allowed).
async function enrichRouteList(routes){
  return Promise.all(routes.map(async r=>{
    try{ const full = await getRouteCached(r.id); return {...r, origin:full.origin, destination:full.destination}; }
    catch(e){ return {...r, origin:{label:'Unknown'}, destination:{label:'Unknown'}}; }
  }));
}
let userCache = {};
async function getUserCached(userId){
  if(!userId) return null;
  if(userCache[userId]) return userCache[userId];
  try{ const u = await api.getUserById(userId); userCache[userId]=u; return u; }
  catch(e){ return null; }
}
async function enrichTrip(t){
  const match = await api.getMatch(t.matchId);
  const mine = await myRouteIds();
  const iAmDriver = mine.has(match.driverRouteId);
  const myRouteId = iAmDriver ? match.driverRouteId : match.riderRouteId;
  let myRoute = null, counterpart = null;
  try{ myRoute = await getRouteCached(myRouteId); }catch(e){ /* ignore */ }
  try{
    const candidates = await getMatchesForRouteCached(myRouteId);
    const found = candidates.find(c=>c.matchId===t.matchId);
    if(found && found.counterpartRoute) counterpart = found.counterpartRoute;
  }catch(e){ /* ignore */ }
  const other = counterpart || {userId:null, name: iAmDriver?'Rider':'Driver', rating:0};
  return {
    ...t,
    iAmDriver,
    driverRoute: myRoute ? {origin:myRoute.origin.label, destination:myRoute.destination.label, departureTime:myRoute.departureTime} : {origin:'Your route', destination:'', departureTime:other.departureTime||'—'},
    driver: iAmDriver ? {userId:S.user.id, name:S.user.name, rating:S.user.rating} : {userId:other.userId, name:other.name, rating:other.rating},
    rider: iAmDriver ? {userId:other.userId, name:other.name, rating:other.rating} : {userId:S.user.id, name:S.user.name, rating:S.user.rating},
  };
}

async function restoreSession(){
  if(S.user) return true;
  if(!getAccessToken()) return false;
  try{
    S.user = await api.getMe();
    S.userId = S.user.id;
    try{ S.hasDriverProfile = !!(await api.getDriverProfile(S.user.id)); }catch(e){ S.hasDriverProfile = false; }
    return true;
  }catch(e){
    clearTokens(); S.userId=null; S.user=null;
    return false;
  }
}

async function render(){
  const app = document.getElementById('app');
  const path = (location.hash || '#/login').replace(/^#/,'');
  const [seg, id, sub] = path.split('/').filter(Boolean);

  if(['login','register','verify-otp'].includes(seg)){
    app.innerHTML = renderAuthShell(seg);
    initIcons(); bindAuthEvents(seg);
    return;
  }

  const ok = await restoreSession();
  if(!ok){ location.hash='#/login'; return; }

  app.innerHTML = `<div class="loading-page"><div class="spinner spinner-dark"></div> Loading…</div>`;
  let unread=0, pending=0;
  try{
    const [notifs, reqs] = await Promise.all([
      api.listNotifications({unread:true, limit:50}).catch(()=>[]),
      isDriver() ? api.listIncomingRequests({status:'requested', limit:50}).catch(()=>[]) : Promise.resolve([]),
    ]);
    unread = notifs.length;
    pending = reqs.length;
  }catch(e){ /* non-fatal — badges just show 0 */ }

  app.innerHTML = renderAppShell(seg, id, {unread, pending});
  initIcons();
  bindShellEvents();
  await renderView(seg, id, sub);
}

function openModal(innerHtml, opts={}){

  overlay.innerHTML = `<div class="modal" style="max-width:${opts.width||460}px;">${innerHtml}</div>`;

  initIcons();

/* ---------- MATCHES ---------- */
async function viewMatches(root,u,routeId){
  const myRoutesRaw = (await api.listMyRoutes()).filter(r=>r.status!=='archived');
  const myRoutes = await enrichRouteList(myRoutesRaw);
  if(!routeId) routeId = myRoutes[0]?.id;
  if(!myRoutes.length){ root.innerHTML = emptyState('sparkles','Post a route first','Matches are ranked candidates for a route you own.', `<button class="btn btn-primary btn-sm" data-go="#/routes/new">Post a route</button>`); initIcons(); bindGoButtons(root); return; }
  const activeRoute = myRoutes.find(r=>r.id===routeId) || myRoutes[0];

  root.innerHTML = `
    <div class="field" style="max-width:420px;">
      <label>Ranking matches for</label>
      <select id="routeSelect">${myRoutes.map(r=>`<option value="${r.id}" ${r.id===activeRoute.id?'selected':''}>${r.role==='driver'?'Driving':'Riding'} · ${escapeHtml(r.origin.label)} → ${escapeHtml(r.destination.label)} · ${r.departureTime}</option>`).join('')}</select>
    </div>
    <div class="demo-note">${icon('info','icon-sm')}<span>Exact pickup/drop-off addresses stay private until you're matched — only name, rating, and timing are shown here.</span></div>
    <div id="matchList" style="margin-top:16px;"><div class="loading-page"><div class="spinner spinner-dark"></div> Ranking candidates…</div></div>
  `;
  initIcons();
  document.getElementById('routeSelect').addEventListener('change', (e)=> { history.replaceState(null,'','#/matches/'+e.target.value); viewMatches(root,u,e.target.value); });

  const listEl = document.getElementById('matchList');
  let matches;
  try{ matches = await api.getMatchesForRoute(activeRoute.id, {limit:50}); }
  catch(ex){ listEl.innerHTML = emptyState('alert-triangle','Could not load matches', ex.message); initIcons(); return; }
  if(!listEl) return;
  if(!matches.length){ listEl.innerHTML = emptyState('sparkles','No candidates yet','Check back soon — we rank overlap by route and timing.'); initIcons(); return; }
  listEl.innerHTML = `<div class="list">${matches.map(m=>matchRow(m,u,activeRoute)).join('')}</div>`;
  initIcons();
  listEl.querySelectorAll('[data-request]').forEach(el=> el.addEventListener('click', async ()=>{
    el.disabled=true; el.innerHTML=`<div class="spinner"></div>`;
    try{ await api.sendRequest(el.dataset.request, ''); toast('Request sent to the driver.'); viewMatches(root,u,activeRoute.id); }
    catch(ex){ toast(ex.message,true); el.disabled=false; el.innerHTML='Send request'; }
  }));
}
function matchRow(m,u,activeRoute){
  const c = m.counterpartRoute;
  if(!c) return '';
  const pct = Math.round(m.overlapScore*100);
  const canRequest = activeRoute.role==='rider' && m.status==='suggested';
  return `
  <div class="row">
    ${avatarHtml({name:c.name}, 40)}
    <div class="row-main">
      <div class="title">${escapeHtml(c.name)} <span style="color:var(--ink-faint); font-weight:400; font-size:12.5px;">${icon('star','icon-sm')} ${c.rating||'new'}</span> ${statusBadge(m.status)}</div>
      <div class="sub"><span class="mono">${c.departureTime}</span><span>${c.role==='driver'?'Driving':'Riding'}</span><span class="mono">${daysPretty(c.daysOfWeek)}</span></div>
      <div style="display:flex; align-items:center; gap:8px; margin-top:8px; max-width:220px;">
        <div class="progress-track" style="flex:1;"><div class="progress-fill" style="width:${pct}%; background:${pct>75?'var(--teal)':pct>50?'var(--amber)':'var(--coral)'};"></div></div>
        <span class="mono" style="font-size:12px; color:var(--ink-faint);">${pct}%</span>
      </div>
    </div>
    <div class="row-actions">
      ${canRequest ? `<button class="btn btn-primary btn-sm" data-request="${m.matchId}">Send request</button>` : `<span style="font-size:12px; color:var(--ink-faint);">${m.status==='requested'?'Awaiting driver':m.status==='approved'?'Matched':m.status==='declined'?'Declined':'Preview only'}</span>`}
    </div>
  </div>`;
}

    S.hasDriverProfile ? api.getDriverProfile(u.id).catch(()=>null) : null,
    api.listEmergencyContacts(),
    api.ratingsForUser(u.id),
  ]);
  root.innerHTML = `
    <div style="display:grid; grid-template-columns:1fr 1.3fr; gap:20px;" class="profile-grid">
      <div>
        <div class="card" style="text-align:center;">
          <div style="position:relative; display:inline-block;">
            ${avatarHtml(u,84)}
            <label for="avatarInput" class="icon-btn" style="position:absolute; bottom:0; right:0; background:var(--amber); border-color:var(--amber); color:#fff; cursor:pointer;">${icon('upload','icon-sm')}</label>
            <input type="file" id="avatarInput" accept="image/*" style="display:none;">
          </div>
          <h3 style="margin-top:14px; font-size:17px;">${escapeHtml(u.name)}</h3>
          <div style="color:var(--ink-faint); font-size:13px;">${escapeHtml(u.email)}</div>
          <div style="margin-top:8px; display:flex; justify-content:center; gap:6px;">${statusBadge(u.verified?'active':'open')}<span class="badge b-grey">${icon('star','icon-sm')} ${u.rating||'new'} (${u.ratingCount||0})</span></div>
          <div class="divider"></div>
          <div class="field" style="text-align:left;"><label>Full name</label><input type="text" id="editName" value="${escapeHtml(u.name)}"></div>
          <button class="btn btn-primary btn-block btn-sm" id="saveProfile">Save changes</button>
        </div>

        <div class="card" style="margin-top:18px;">
          <div class="section-title" style="margin-bottom:10px;"><h2>${icon('car','icon-sm')} Vehicle</h2></div>
          ${driverProfile ? `
            <div class="kv"><span>Car model</span><b>${escapeHtml(driverProfile.carModel)}</b></div>
            <div class="kv"><span>Plate number</span><b class="mono">${escapeHtml(driverProfile.plateNumber)}</b></div>
            <div class="kv"><span>Seats available</span><b>${driverProfile.seatsAvailable}</b></div>
            <button class="btn btn-ghost btn-block btn-sm" id="editVehicle" style="margin-top:12px;">Edit vehicle</button>
          ` : emptyState('car','No vehicle on file','Add your car to post driver routes.', `<button class="btn btn-primary btn-sm" id="editVehicle">${icon('plus','icon-sm')} Add vehicle</button>`)}
        </div>
      </div>

      <div>
        <div class="card">
          <div class="section-title" style="margin-bottom:10px;"><h2>${icon('phone','icon-sm')} Emergency contacts</h2><a class="link-text" id="addContact">+ Add contact</a></div>
          ${contacts.length ? contacts.map(c=>`
            <div class="kv"><span>${escapeHtml(c.name)} <span class="mono" style="color:var(--ink-faint);">${escapeHtml(c.phone)}</span></span><button class="icon-btn" data-del-contact="${c.id}" style="width:28px;height:28px;">${icon('trash-2','icon-sm')}</button></div>
          `).join('') : `<p style="font-size:13px; color:var(--ink-faint);">Add someone we can share your live trip status with.</p>`}
        </div>

        <div class="card" style="margin-top:18px;">
          <div class="section-title" style="margin-bottom:10px;"><h2>${icon('star','icon-sm')} Ratings received</h2></div>
          ${ratings.length ? ratings.slice(0,5).map(r=>`
            <div style="padding:11px 0; border-bottom:1px solid var(--border-soft);">
              <div style="display:flex; justify-content:space-between; align-items:center;">
                <b style="font-size:13.5px;">${escapeHtml(r.fromUser.name)}</b>
                <div class="star-row">${[1,2,3,4,5].map(n=>`<svg width="13" height="13" viewBox="0 0 24 24" class="${n<=r.score?'on':''}" fill="${n<=r.score?'currentColor':'none'}" stroke="currentColor" stroke-width="1.5"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>`).join('')}</div>
              </div>
              ${r.comment?`<p style="font-size:12.5px; color:var(--ink-faint); margin:4px 0 0;">"${escapeHtml(r.comment)}"</p>`:''}
            </div>`).join('') : `<p style="font-size:13px; color:var(--ink-faint);">No ratings yet — they'll show up after your first completed trip.</p>`}
        </div>

        <div class="card" style="margin-top:18px;">
          <div class="section-title" style="margin-bottom:6px;"><h2>${icon('settings','icon-sm')} Backend</h2></div>
          <div class="field"><label>API base URL</label><input type="text" id="apiBaseInput" value="${escapeHtml(getApiBaseUrl())}"></div>
          <button class="btn btn-ghost btn-block btn-sm" id="saveApiBase">Save & reconnect</button>
        </div>

        <div class="card" style="margin-top:18px;">
          <div class="section-title" style="margin-bottom:6px;"><h2>${icon('log-out','icon-sm')} Account</h2></div>
          <p style="font-size:12.5px; color:var(--ink-faint); margin-bottom:12px;">Deleting your account is permanent, and blocked while you have any active route.</p>
          <button class="btn btn-danger btn-sm" id="deleteAccountBtn">Delete account</button>
        </div>
      </div>
    </div>
    <style>@media (max-width:880px){ .profile-grid{grid-template-columns:1fr !important;} }</style>
  `;
  initIcons();
  document.getElementById('saveProfile').addEventListener('click', async ()=>{
    try{ const res = await api.updateMe({name:document.getElementById('editName').value.trim()}); S.user.name = res.name; toast('Profile updated.'); render(); }
    catch(ex){ toast(ex.message,true); }
  });
  document.getElementById('avatarInput').addEventListener('change', async (e)=>{
    const file = e.target.files[0]; if(!file) return;
    toast('Uploading photo…');
    try{ const res = await api.setAvatar(file); S.user.profilePictureUrl = res.profilePictureUrl; toast('Profile picture updated.'); render(); }
    catch(ex){ toast(ex.message,true); }
  });
  document.getElementById('editVehicle')?.addEventListener('click', ()=> openDriverProfileModal(u, ()=>render()));
  document.getElementById('addContact').addEventListener('click', ()=> openContactModal(u, ()=>render()));
  root.querySelectorAll('[data-del-contact]').forEach(el=> el.addEventListener('click', async ()=>{
    try{ await api.deleteEmergencyContact(el.dataset.delContact); toast('Contact removed.'); render(); }
    catch(ex){ toast(ex.message,true); }
  }));
  document.getElementById('saveApiBase').addEventListener('click', ()=>{
    setApiBaseUrl(document.getElementById('apiBaseInput').value.trim());
    toast('Backend URL saved. Reconnecting…');
    clearTokens(); S.user=null; S.userId=null;
    go('#/login');
  });
  document.getElementById('deleteAccountBtn').addEventListener('click', async ()=>{
    if(!confirm('Delete your account? This cannot be undone.')) return;
    try{ await api.deleteMe(); clearTokens(); S.user=null; S.userId=null; toast('Account deleted.'); go('#/login'); }
    catch(ex){ toast(ex.message,true); }
  });
}
function openContactModal(u,onDone){
  openModal(`
    <div class="modal-head"><h3>Add emergency contact</h3><button class="icon-btn" data-close>${icon('x','icon-sm')}</button></div>
    <div class="field"><label>Name</label><input type="text" id="cName" placeholder="e.g. Ayesha Ahmed"></div>
    <div class="field"><label>Phone</label><input type="tel" id="cPhone" placeholder="+92-300-1234567"></div>
    <div id="cErr"></div>
    <button class="btn btn-primary btn-block" id="saveContact">Save contact</button>
  `);
  document.getElementById('saveContact').addEventListener('click', async ()=>{
    try{ await api.addEmergencyContact({name:document.getElementById('cName').value.trim(), phone:document.getElementById('cPhone').value.trim()}); toast('Contact added.'); closeModal(); onDone(); }
    catch(ex){ document.getElementById('cErr').innerHTML = `<div class="err-msg">${escapeHtml(ex.message)}</div>`; }
  });
}

/* ---------- ADMIN ---------- */
async function viewAdmin(root,u,tab){
  root.innerHTML = `
    <div class="tabs">
      <div class="tab ${tab==='users'?'active':''}" data-atab="users">Users</div>
      <div class="tab ${tab==='reports'?'active':''}" data-atab="reports">Reports</div>
      <div class="tab ${tab==='analytics'?'active':''}" data-atab="analytics">Analytics</div>
    </div>
    <div id="adminBody"><div class="loading-page"><div class="spinner spinner-dark"></div></div></div>
  `;
  initIcons();
  root.querySelectorAll('[data-atab]').forEach(el=> el.addEventListener('click', ()=> { history.replaceState(null,'','#/admin/'+el.dataset.atab); viewAdmin(root,u,el.dataset.atab); }));
  const body = document.getElementById('adminBody');
  if(tab==='users') return renderAdminUsers(body,u);
  if(tab==='reports') return renderAdminReports(body,u);
  return renderAdminAnalytics(body,u);
}
let adminUserFilters = {};
async function renderAdminUsers(body,u){
  const users = await api.adminListUsers(adminUserFilters);
  body.innerHTML = `
    <div style="display:flex; gap:10px; margin-bottom:16px; flex-wrap:wrap;">
      <input type="text" id="uq" placeholder="Search name or email…" style="max-width:240px;" value="${adminUserFilters.q||''}">
      <select id="uRole" style="max-width:150px;"><option value="">All roles</option><option value="driver">Driver</option><option value="rider">Rider</option></select>
      <select id="uVerified" style="max-width:170px;"><option value="">Any verification</option><option value="true">Verified</option><option value="false">Unverified</option></select>
    </div>
    <div class="table-wrap"><table>
      <thead><tr><th>Name</th><th>Email</th><th>Role</th><th></th></tr></thead>
      <tbody>${users.map(us=>`
        <tr>
          <td style="display:flex; align-items:center; gap:8px;">${avatarHtml({name:us.name},26)} ${escapeHtml(us.name)}</td>
          <td>${escapeHtml(us.email)}</td>
          <td>${us.role}${us.verified?'':' '+`<span class="badge b-coral">unverified</span>`}</td>
          <td style="text-align:right; white-space:nowrap;">
            ${!us.verified?`<button class="btn btn-ghost btn-sm" data-verify="${us.id}">Verify</button>`:''}
            <button class="btn btn-danger btn-sm" data-suspend="${us.id}" data-status="suspended">Suspend</button>
            <button class="btn btn-teal btn-sm" data-suspend="${us.id}" data-status="active">Reinstate</button>
          </td>
        </tr>`).join('') || `<tr><td colspan="4" style="text-align:center; color:var(--ink-faint); padding:30px;">No users match these filters.</td></tr>`}</tbody>
    </table></div>
    <div class="demo-note" style="margin-top:12px;">${icon('info','icon-sm')}<span>The user list endpoint doesn't return current suspension status, so both actions are always shown — pick whichever applies.</span></div>
  `;
  initIcons();
  document.getElementById('uq').addEventListener('input', debounce((e)=>{ adminUserFilters.q=e.target.value; renderAdminUsers(body,u); },350));
  document.getElementById('uRole').addEventListener('change', (e)=>{ adminUserFilters.role=e.target.value; renderAdminUsers(body,u); });
  document.getElementById('uVerified').addEventListener('change', (e)=>{ adminUserFilters.verified=e.target.value; renderAdminUsers(body,u); });
  body.querySelectorAll('[data-verify]').forEach(el=> el.addEventListener('click', async ()=>{ await api.adminVerifyUser(el.dataset.verify); toast('User verified.'); renderAdminUsers(body,u); }));
  body.querySelectorAll('[data-suspend]').forEach(el=> el.addEventListener('click', async ()=>{ await api.adminSetUserStatus(el.dataset.suspend, el.dataset.status); toast(`User ${el.dataset.status}.`); renderAdminUsers(body,u); }));
}
function debounce(fn,ms){ let t; return (...a)=>{ clearTimeout(t); t=setTimeout(()=>fn(...a),ms); }; }
let adminReportFilter='';
async function renderAdminReports(body,u){
  const reports = await api.adminListReports(adminReportFilter?{status:adminReportFilter}:{});
  // Report.toPublicJSON only returns reportedUserId/reportedByUserId (raw ids) —
  // resolve display names via GET /users/:userId, cached.
  await Promise.all(reports.flatMap(r=>[getUserCached(r.reportedUserId), getUserCached(r.reportedByUserId)]));
  body.innerHTML = `
    <div style="display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap;">
      ${['', 'open','reviewing','resolved','dismissed'].map(s=>`<button class="btn ${adminReportFilter===s?'btn-primary':'btn-ghost'} btn-sm" data-rf="${s}">${s?s[0].toUpperCase()+s.slice(1):'All'}</button>`).join('')}
    </div>
    ${reports.length ? `<div class="list">${reports.map(r=>`
      <div class="row">
        <div class="row-main">
          <div class="title">${escapeHtml(userCache[r.reportedUserId]?.name || 'Unknown user')} ${statusBadge(r.status)}</div>
          <div class="sub"><span>Reported by ${escapeHtml(userCache[r.reportedByUserId]?.name || '—')}</span><span>${timeAgo(r.createdAt)}</span></div>
          <div class="sub" style="margin-top:2px;">"${escapeHtml(r.reason)}"</div>
        </div>
        ${r.status==='open'||r.status==='reviewing' ? `<div class="row-actions"><button class="btn btn-teal btn-sm" data-resolve="${r.id}">Resolve</button><button class="btn btn-ghost btn-sm" data-dismiss="${r.id}">Dismiss</button></div>` : ''}
      </div>
    `).join('')}</div>` : emptyState('shield-check','No reports','Nothing flagged for review right now.')}
  `;
  initIcons();
  body.querySelectorAll('[data-rf]').forEach(el=> el.addEventListener('click', ()=>{ adminReportFilter=el.dataset.rf; renderAdminReports(body,u); }));
  body.querySelectorAll('[data-resolve]').forEach(el=> el.addEventListener('click', async ()=>{ await api.adminResolveReport(el.dataset.resolve,'resolved','Reviewed by admin.'); toast('Report resolved.'); renderAdminReports(body,u); }));
  body.querySelectorAll('[data-dismiss]').forEach(el=> el.addEventListener('click', async ()=>{ await api.adminResolveReport(el.dataset.dismiss,'dismissed'); toast('Report dismissed.'); renderAdminReports(body,u); }));
}
async function renderAdminAnalytics(body,u){
  const a = await api.adminAnalytics();
  body.innerHTML = `
    <div class="stat-grid">
      <div class="stat-card"><div class="icon-wrap" style="background:var(--teal-soft); color:var(--teal);">${icon('route','icon-sm')}</div><b>${a.routesPosted}</b><span>Routes posted</span></div>
      <div class="stat-card"><div class="icon-wrap" style="background:var(--amber-soft); color:var(--amber-ink);">${icon('users-round','icon-sm')}</div><b>${a.activeUsers}</b><span>Active users</span></div>
      <div class="stat-card"><div class="icon-wrap" style="background:var(--teal-soft); color:var(--teal);">${icon('sparkles','icon-sm')}</div><b>${a.routesWithAtLeastOneMatchPct}%</b><span>Routes with a match</span></div>
      <div class="stat-card"><div class="icon-wrap" style="background:var(--amber-soft); color:var(--amber-ink);">${icon('navigation','icon-sm')}</div><b>${a.confirmedRecurringTrips}</b><span>Confirmed recurring trips</span></div>
    </div>
    <div class="card">
      <div class="section-title" style="margin-bottom:14px;"><h2>Match rate</h2></div>
      <div class="progress-track" style="height:10px;"><div class="progress-fill" style="width:${a.routesWithAtLeastOneMatchPct}%;"></div></div>
      <p style="font-size:12.5px; color:var(--ink-faint); margin-top:10px;">${a.routesWithAtLeastOneMatchPct}% of all posted routes have matched with at least one counterpart route.</p>
      <div class="demo-note">${icon('info','icon-sm')}<span>Figures mirror the platform's example metrics; this demo's live seed data trends similarly at smaller scale.</span></div>
    </div>
  `;
  initIcons();
}

/* ======================================================================
   BOOT
   ====================================================================== */
render();
</script>
</body>
</html>
